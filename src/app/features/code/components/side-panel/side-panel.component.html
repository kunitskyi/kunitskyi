@if (isShown) {
  <p>{{ "code.sidePanel.explorer.header" | transloco }}</p>
  <kun-accordion [text]="'code.sidePanel.explorer.workspace.title' | transloco">
    @for (file of availableFiles; track file) {
      <kun-files
        [iconSrc]="availableFiles[file].iconSrc"
        [name]="file"
        (fileSelectedEvent)="selectFile(file)"
      ></kun-files>
    }
  </kun-accordion>
}
