<kun-sidebar
  [isSidePanelShown]="isSidePanelShown"
  (showSidePanelEvent)="showSidePanel($event)"
></kun-sidebar>
@if (isSidePanelShown) {
  <kun-side-panel
    (resizeXEvent)="changeSidePanelWidth($event)"
  ></kun-side-panel>
}
<kun-editor></kun-editor>
<kun-workbench></kun-workbench>
@if (isNotificationShown) {
  <kun-notifications
    (hideNotificationsEvent)="toggleNotifications()"
  ></kun-notifications>
}
<kun-state-bar
  (toggleNotificationEvent)="toggleNotifications()"
></kun-state-bar>
