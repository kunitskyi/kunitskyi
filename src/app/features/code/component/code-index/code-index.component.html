<kun-sidebar
  [isSidePanelShown]="isShown.sidePanel"
  (showSidePanelEvent)="toggleSidePanel($event)"
></kun-sidebar>
<kun-side-panel
  #sidePanel
  [show]="isShown.sidePanel"
  kunResize
  resizeType="right"
  (resizeEvent)="changeSidePanelWidth($event)"
  (selectstart)="(false)"
></kun-side-panel>
@if (isShown.editor) {
  <kun-editor></kun-editor>
}
<kun-workbench
  [class.ActiveBorder]="isShown.workbench && isShown.editor"
  #workbench
  [show]="isShown.workbench"
  kunResize
  resizeType="top"
  (resizeEvent)="changeWorkbenchHeight($event)"
></kun-workbench>
@if (isShown.notifications) {
  <kun-notifications
    (hideNotificationsEvent)="toggleNotifications()"
  ></kun-notifications>
}
<kun-state-bar
  (toggleNotificationEvent)="toggleNotifications()"
></kun-state-bar>
