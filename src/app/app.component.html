@if (isViewChangeTriggered || view === FeatureView.Page) {
  <kun-dog-ear
    [class.Active]="view === FeatureView.Page"
    [view]="FeatureView.Page"
    [isViewChangeTriggered]="isViewChangeTriggered"
    (startChangeViewEvent)="startChangeView($event)"
    (changeViewEvent)="changeView($event)"
  >
    <kun-page-index></kun-page-index>
  </kun-dog-ear>
}

@if (isViewChangeTriggered || view === FeatureView.Code) {
  <kun-dog-ear
    [class.Active]="view === FeatureView.Code"
    [view]="FeatureView.Code"
    [isViewChangeTriggered]="isViewChangeTriggered"
    (startChangeViewEvent)="startChangeView($event)"
    (changeViewEvent)="changeView($event)"
  >
    <kun-code-index></kun-code-index>
  </kun-dog-ear>
}
